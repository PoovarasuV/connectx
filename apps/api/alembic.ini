# A generic, single database configuration.

[alembic]

# Path to migration scripts.
script_location = %(here)s/alembic

# Template used to generate migration file names.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Python path.
prepend_sys_path = .

# Timezone to use when rendering migration dates.
# Leave blank to use local time.
# timezone =

# Maximum length of characters used in migration slug.
# truncate_slug_length = 40

# Run the environment during the revision command.
# revision_environment = false

# Allow .pyc/.pyo files without source files.
# sourceless = false

# Migration version locations.
# version_locations = %(here)s/alembic/versions

# Path separator for version locations.
path_separator = os

# Recursively search version locations.
# recursive_version_locations = false

# Output encoding.
# output_encoding = utf-8

# Database URL is loaded from app.config / .env in alembic/env.py.
# Do not put the real database password here.
sqlalchemy.url =


[post_write_hooks]

# Format using Black.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Lint with Ruff.
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Alternatively, use the Ruff executable.
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
